! FRR configuration for the bastion / NAT gateway (ISIS underlay)
! Host: dell-r450-nfv2023-04.lab.eng.brq2.redhat.com
! NIC:  eno12399np0 (connected to switch et-0/0/6)
!
! This node:
!   - Originates the default route into ISIS for cluster nodes
!   - NATs cluster traffic to the internet via eno8303

frr version 10.6
frr defaults traditional
hostname dell-r450-nfv2023-04
log syslog informational
!
interface eno12399np0
 ip address 10.0.0.4/32
 ipv6 address fc00:0:1::4/128
 ip router isis UNDERLAY
 ipv6 router isis UNDERLAY
 isis network point-to-point
 isis circuit-type level-1
exit
!
router isis UNDERLAY
 is-type level-1
 net 49.0001.0000.0000.0004.00
 topology ipv6-unicast
 log-adjacency-changes
 default-information originate ipv4 level-1 always
 default-information originate ipv6 level-1 always
exit
!
ip forwarding
ipv6 forwarding
!
end
