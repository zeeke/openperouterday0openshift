# dnsmasq configuration for OpenShift cluster DNS
# Runs on dell-r450-nfv2023-04, listening on the underlay IP (10.0.0.4).
#
# OCP nodes reach this via ISIS through the switch.
# Upstream queries go directly to the lab DNS server.

listen-address=10.0.0.4
bind-interfaces

# Local domain
local=/sno-lab.example.com/
domain=sno-lab.example.com

# API VIP
address=/api.sno-lab.example.com/192.168.110.2
address=/api-int.sno-lab.example.com/192.168.110.2

# Ingress VIP (wildcard)
address=/.apps.sno-lab.example.com/192.168.110.2
