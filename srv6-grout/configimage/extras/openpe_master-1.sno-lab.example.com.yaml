rawfrrconfigs:
  - priority: 100
    rawConfig: |
      interface underlay0
        ipv6 router isis ISIS
        isis network point-to-point


l3vpns:
  - name: red
    vrf: red
    rdAssignedNumber: 2
    importRTs:
      - "65500:2"
    exportRTs:
      - "65500:2"


l2vnis:
  - vni: 210
    routingDomain:
      type: L3VPN
      l3vpn: { name: red }
    vxlanport: 4789
    gatewayIPs:
      - "192.168.110.1/24"
      - "fd00:110::1/64"
    sriovVFPair:
      pfName: eno12399
      vfIndex: 1
      vlan: 42   # The same as in agent-config.yaml
      acceleratedConfig: {}

underlays:
  - asn: 65500
    routerIDCIDR: 10.0.0.0/24
    interfaces:
      - type: NetworkDevice
        networkDevice:
          interfaceName: eno12399v0  # TODO: avoid referencing the VF netlink name here
          acceleratedConfig:
            portName: underlay0
    neighbors:
      - asn: 65500
        address: "fc00:0:14::1"
        addressFamilies:
          - type: evpn
    tunnelEndpoint:
      cidrs:
        #- "10.0.0.0/24"
        - "fc00:100::0/112"
    isis:
      baseNet: "49.0001.0000.0000.0000.00"
      level: 1
      features: ["advertisePassiveOnly"]
      interfaces:
        - name: underlay0
          ipFamily: IPv6
    srv6:
      encapBehavior: "H.Encaps.Red"
      locator:
        basePrefix: "fd00:3::/48"
        format: "usid-f3216"

