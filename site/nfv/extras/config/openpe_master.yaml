# OpenPERouter FRR Configuration Template — EVPN Route Reflector (ISIS + SRv6)
# Copied by generate-config.sh
#
# Peering model:
#   - TOR (direct):     ipv4 vpn + ipv6 vpn  (SRv6 routes only)
#   - EVPN-CLIENTS:     l2vpn evpn only (reflected)

underlays:
  - asn: 65500
    tunnelEndpoint:
      cidrs:
        - fc00::/64
    interfaces:
    - type: NetworkDevice
      networkDevice:
        interfaceName: underlayvf
    routerIDCIDR: 10.0.0.0/24
    isis:
      baseNet: "49.0001.0000.0000.0000.00"
      level: 1
      interfaces:
      - name: underlayvf
        ipFamily: DualStack
    srv6:
      encapBehavior: "H.Encaps.Red"
      locator:
        basePrefix: "fd00:0:0::/48"
        format: "usid-f3216"
    routeReflector:
      clusterID: 10.255.255.255
    neighbors:
      - type: Internal
        address: "fc00:0:14::1"
      - type: Internal
        listenRange: fc00::/64
        addressFamilies:
          - type: evpn
            properties:
              - type: routeReflectorClient
      - type: Internal
        address: fc00::2
        addressFamilies:
          - type: evpn
      - type: Internal
        address: fc00::3
        addressFamilies:
          - type: evpn
      - type: Internal
        address: fc00::4
        addressFamilies:
          - type: evpn

l2trunks:
  - name: trunk
    type: SRIOV
    sriov:
      # trunkpf aliases the PF on every node (see openperouter-*-vf-aliases.bu)
      pfName: trunkpf
      vfIndex: 1

l2vnis:
  - name: vni210
    vni: 210
    routingDomain:
      type: L3VPN
      l3vpn:
        name: red
    vxlanport: 4789
    gatewayIPs:
      - "192.168.110.1/24"
      - "fd00:110::1/64"
    trunk:
      name: trunk
      vlan:
        tag: 42   # VLAN of the host VF in agent-config.yaml

l3vpns:
  - name: red
    vrf: red
    rdAssignedNumber: 2
    exportRTs:
    - "65500:2"
    importRTs:
    - "65500:2"

rawfrrconfigs:
  - priority: 100
    rawConfig: |
      interface u_underlayvf
        ipv6 router isis ISIS
        isis network point-to-point
      exit

      router isis ISIS
        topology ipv6-unicast
      exit