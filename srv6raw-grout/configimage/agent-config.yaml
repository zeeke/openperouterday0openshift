apiVersion: v1alpha1
metadata:
  name: sno-lab
  namespace: cluster0
additionalNTPSources:
- 10.100.0.1
rendezvousIP: 192.168.110.2
hosts:
- hostname: master-0
  interfaces:
  - name: ens3f0np0
    macAddress: B8:E9:24:16:09:AC
  - name: eno12399np0
    macAddress: B8:E9:24:8F:D8:B6
  networkConfig:
    interfaces:
    - name: eno12399np0
      state: up
      type: ethernet
      ipv4:
        enabled: false
      ipv6:
        enabled: false
      ethernet:
        sr-iov:
          total-vfs: 8
          vfs:
          - id: 0 # underlay
            vlan-id: 0
            spoof-check: false
            trust: true
          - id: 1 # trunk
            vlan-id: 0
            spoof-check: false
            trust: true
          - id: 2 # host
            vlan-id: 42
            spoof-check: false
            trust: true

    - name: eno12409np1
      state: down
      type: ethernet

    - name: bond1
      state: down
      type: bond
      link-aggregation:
        mode: 802.3ad
        options: {"miimon": 100}
        ports:
          - ens3f0np0
          - ens3f1np1
    - name: ens3f0np0
      state: down
      type: ethernet
    - name: ens3f1np1
      state: down
      type: ethernet
    - name: bond1.16
      state: up
      type: vlan
      wait-ip: ipv4
      ipv4:
        address:
          - ip: 192.168.21.31
            prefix-length: 25
        dhcp: false
        enabled: true
      vlan:
        base-iface: bond1
        id: 16

    - name: eno12399v2
      type: ethernet
      state: up
      mtu: 1400
      ipv4:
        enabled: true
        auto-dns: false
        address:
        - ip: 192.168.110.2
          prefix-length: 24
        dhcp: false
      ipv6:
        enabled: true
        auto-dns: false
        address:
        - ip: fd00:110::2
          prefix-length: 64
        dhcp: false

    dns-resolver:
      config:
        server:
        - 192.168.110.1
        - fd00:110::1
    routes:
      config:
      - destination: 0.0.0.0/0
        next-hop-address: 192.168.110.1
        next-hop-interface: eno12399v2
        table-id: 254
      - destination: ::/0
        next-hop-address: fd00:110::1
        next-hop-interface: eno12399v2
        table-id: 254
