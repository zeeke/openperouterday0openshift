# agent-config.yaml - Per-node hardware configuration
#
# Each node needs:
#   - Two PFs with total-vfs: 16 and mtu: 1800 (for VXLAN/SRv6 overhead)
#   - PF0 VF0: grout underlay port (auto-detected by 99-perouter dispatcher)
#   - PF1 VF0: grout underlay port (auto-detected by 99-perouter dispatcher)
#   - PF0 VF1: host VF, VLAN 42, cluster IP
#   - VF2+: available for pod workloads
#
# VF binding and address derivation are handled automatically by the
# NM dispatcher script 99-perouter (shipped via butane):
#   - VF index 0 on any PF: calls perouter-bind.sh
#   - VF with a default route: calls perouter-host-dispatch.sh
#
# Tune: MAC addresses, host IPs, rendezvousIP, DNS/NTP servers.
# The addressing scheme is defined in openperouter.env, not here.
apiVersion: v1alpha1
metadata:
  name: sno-lab
  namespace: cluster0
additionalNTPSources:
- 10.100.0.1
rendezvousIP: 192.168.110.2
hosts:
- hostname: master-0.sno-lab.example.com
  rootDeviceHints:
    deviceName: /dev/sda
  interfaces:
  - name: ens1f0np0
    macAddress: b8:3f:d2:fa:53:86
  networkConfig:
    interfaces:
    - name: eno8303 # lab connectivity for debug
      type: ethernet
      state: up
      ipv4:
        enabled: true
        auto-dns: false
        auto-hostname: false
        dhcp: true
      ipv6:
        enabled: false
    - name: ens1f0np0
      type: ethernet
      state: up
      mtu: 1800
      ipv4:
        enabled: false
      ipv6:
        enabled: false
      ethernet:
        sr-iov:
          total-vfs: 16
          vfs:
          - id: 0 # underlay0
            vlan-id: 0
            spoof-check: false
            trust: true
          - id: 1 # host
            vlan-id: 42
            spoof-check: false
            trust: true
    - name: ens1f1np1
      type: ethernet
      state: up
      mtu: 1800
      ipv4:
        enabled: false
      ipv6:
        enabled: false
      ethernet:
        sr-iov:
          total-vfs: 16
          vfs:
          - id: 0 # underlay1
            vlan-id: 0
            spoof-check: false
            trust: true
    - name: ens1f0v0 # underlay0 (grout)
      type: ethernet
      state: up
    - name: ens1f1v0 # underlay1 (grout)
      type: ethernet
      state: up
    - name: ens1f0v1 # host
      type: ethernet
      state: up
      ipv4:
        enabled: true
        auto-dns: false
        address:
        - ip: 192.168.110.2
          prefix-length: 24
        dhcp: false
      ipv6:
        enabled: true
        auto-dns: false
        autoconf: false
        address:
        - ip: fd00:110::2
          prefix-length: 64
        dhcp: false
    dns-resolver:
      config:
        server:
        - 10.100.0.1
        - fd00:100::1
    routes:
      config:
      - destination: 0.0.0.0/0
        next-hop-address: 192.168.110.1
        next-hop-interface: ens1f0v1
      - destination: ::/0
        next-hop-address: fd00:110::1
        next-hop-interface: ens1f0v1
