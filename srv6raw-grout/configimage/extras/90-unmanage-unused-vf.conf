# Prevent NM from auto-managing unused SR-IOV VFs (v2-v15).
# Without this, NM creates "Wired connection N" profiles with
# ipv6.method=auto, overriding any sysctl disable_ipv6/accept_ra
# settings and causing the assisted-service non-overlapping-subnets
# validation to fail (all VFs share the same SLAAC prefix).
#[keyfile]
#unmanaged-devices=interface-name:eno12399v2;interface-name:eno12399v3;interface-name:eno12399v4;interface-name:eno12399v5;interface-name:eno12399v6;interface-name:eno12399v7;interface-name:eno12399v8;interface-name:eno12399v9;interface-name:eno12399v10;interface-name:eno12399v11;interface-name:eno12399v12;interface-name:eno12399v13;interface-name:eno12399v14;interface-name:eno12399v15
