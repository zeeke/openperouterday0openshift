# Prevent NM from auto-managing unused SR-IOV VFs (v2-v15).
# Without this, NM creates "Wired connection N" profiles with
# ipv6.method=auto, overriding any sysctl disable_ipv6/accept_ra
# settings and causing the assisted-service non-overlapping-subnets
# validation to fail (all VFs share the same SLAAC prefix).
# TODO: find a portable solution
[keyfile]
unmanaged-devices=driver:mlx5_core,driver:iavf
