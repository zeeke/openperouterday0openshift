! FRR configuration for the SRv6 gateway / external peer (ISIS + SRv6 L3VPN)
! Host: dell-r450-nfv2023-04.lab.eng.brq2.redhat.com
! NIC:  eno12399np0 (connected to switch, in perouter netns)
!
! FRR runs in a separate network namespace (perouter) with:
!   - eno12399np0: ISIS underlay, SRv6 transport
!   - veth-frr: link to default netns (in VRF red)
!
! The default netns hosts DNS/NTP on loopback and NATs via eno8303.
! A veth pair connects VRF red to the default netns, avoiding
! cross-VRF NAT issues.

frr version 10.6
frr defaults traditional
hostname dell-r450-nfv2023-04
log syslog informational
!
interface eno12399np0
 ip address 10.0.0.20/32
 ipv6 address fc00:100::14/128
 ipv6 address fc00:0:14::1/128
 ipv6 address fd00:14::1/128
 ip router isis PE
 ipv6 router isis PE
 isis network point-to-point
 isis circuit-type level-1
exit
!
vrf red
exit-vrf
!
interface veth-frr vrf red
 ip address 10.200.0.1/30
exit
!
router bgp 65500
 bgp router-id 10.0.0.20
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 bgp log-neighbor-changes
 !
 neighbor PE-NODES peer-group
 neighbor PE-NODES remote-as 65500
 neighbor PE-NODES update-source fc00:0:14::1
 bgp listen range fc00::/16 peer-group PE-NODES
 !
 segment-routing srv6
  locator MAIN
 exit
 !
 address-family ipv4 vpn
  neighbor PE-NODES activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor PE-NODES activate
 exit-address-family
exit
!
router bgp 65500 vrf red
 bgp router-id 10.0.0.20
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 sid vpn per-vrf export auto
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
  rd vpn export 10.0.0.20:2
  rt vpn both 65500:2
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  redistribute static
  rd vpn export 10.0.0.20:2
  rt vpn both 65500:2
  export vpn
  import vpn
 exit-address-family
exit
!
ip route 0.0.0.0/0 10.200.0.2 vrf red
ip route 10.100.0.1/32 10.200.0.2 vrf red
ip route 10.10.20.1/32 10.200.0.2 vrf red
ipv6 route ::/0 fd00:200::2 vrf red
ipv6 route fd00:100::1/128 fd00:200::2 vrf red
ipv6 route fc00:10:20::1/128 fd00:200::2 vrf red
!
router isis PE
 is-type level-1
 net 49.0001.0000.0000.0020.00
 topology ipv6-unicast
 lsp-gen-interval 2
 log-adjacency-changes
 log-pdu-drops
 segment-routing srv6
  locator MAIN
 exit
exit
!
segment-routing
 srv6
  encapsulation
   source-address fd00:14::1
  exit
  locators
   locator MAIN
    prefix fd00:14::/48 block-len 32 node-len 16 func-bits 16
    behavior usid
   exit
  exit
 exit
exit
!
ip forwarding
ipv6 forwarding
!
end
